name: private-search

x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILES:-3}

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  logging: *logging

services:
  search-gateway:
    <<: *hardened
    build:
      context: .
      dockerfile: Dockerfile.gateway
      target: runtime
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.11.15-slim-bookworm}
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-10001}
    image: ${SEARCH_GATEWAY_IMAGE:-private-search-gateway:local}
    command: [python, search_gateway.py]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_URL: redis://redis:6379/0
      RERANKER_URL: http://reranker:8000
      SEARXNG_URL: http://searxng:8080
      WEB_RUNNER_SOCKET: /run/search-gateway-web/runner.sock
      PDF_RUNNER_SOCKET: /run/search-gateway-pdf/runner.sock
      GATEWAY_REQUEST_TIMEOUT_SECONDS: ${GATEWAY_REQUEST_TIMEOUT_SECONDS:-30}
      GATEWAY_SEARCH_TIMEOUT_SECONDS: ${GATEWAY_SEARCH_TIMEOUT_SECONDS:-7}
      GATEWAY_PAGE_TIMEOUT_SECONDS: ${GATEWAY_PAGE_TIMEOUT_SECONDS:-16}
      GATEWAY_MAX_SEARCH_RESULTS: ${GATEWAY_MAX_SEARCH_RESULTS:-30}
      GATEWAY_MAX_CRAWL_PAGES: ${GATEWAY_MAX_CRAWL_PAGES:-6}
      GATEWAY_MAX_FOLLOW_LINKS: ${GATEWAY_MAX_FOLLOW_LINKS:-2}
      GATEWAY_MAX_CONCURRENT_FETCHES: ${GATEWAY_MAX_CONCURRENT_FETCHES:-4}
      GATEWAY_MAX_CONCURRENT_REQUESTS: ${GATEWAY_MAX_CONCURRENT_REQUESTS:-4}
      GATEWAY_ADMISSION_TIMEOUT_SECONDS: ${GATEWAY_ADMISSION_TIMEOUT_SECONDS:-2}
      GATEWAY_FINALIZATION_RESERVE_SECONDS: ${GATEWAY_FINALIZATION_RESERVE_SECONDS:-3}
      GATEWAY_CANDIDATE_RERANKER_TIMEOUT_SECONDS: ${GATEWAY_CANDIDATE_RERANKER_TIMEOUT_SECONDS:-2}
      GATEWAY_MAX_FINAL_RESULTS: ${GATEWAY_MAX_FINAL_RESULTS:-8}
      GATEWAY_MAX_PASSAGE_CHARS: ${GATEWAY_MAX_PASSAGE_CHARS:-2600}
      GATEWAY_MAX_CONTENT_CHARS: ${GATEWAY_MAX_CONTENT_CHARS:-7000}
      GATEWAY_QUERY_MAX_CHARS: ${GATEWAY_QUERY_MAX_CHARS:-4000}
      GATEWAY_MAX_REQUEST_BYTES: ${GATEWAY_MAX_REQUEST_BYTES:-65536}
      GATEWAY_CACHE_TTL_SECONDS: ${GATEWAY_CACHE_TTL_SECONDS:-900}
      GATEWAY_CACHE_STALE_SECONDS: ${GATEWAY_CACHE_STALE_SECONDS:-86400}
      GATEWAY_CACHE_MAX_ENTRIES: ${GATEWAY_CACHE_MAX_ENTRIES:-256}
      GATEWAY_RERANKER_TIMEOUT_SECONDS: ${GATEWAY_RERANKER_TIMEOUT_SECONDS:-5}
      GATEWAY_RERANKER_MAX_RESPONSE_BYTES: ${GATEWAY_RERANKER_MAX_RESPONSE_BYTES:-2097152}
      GATEWAY_DIRECT_TIMEOUT_SECONDS: ${GATEWAY_DIRECT_TIMEOUT_SECONDS:-5}
      GATEWAY_DIRECT_MAX_BYTES: ${GATEWAY_DIRECT_MAX_BYTES:-8388608}
      GATEWAY_PAGE_MAX_CHARS: ${GATEWAY_PAGE_MAX_CHARS:-300000}
      SAFE_EGRESS_ALLOWED_PORTS: ${SAFE_EGRESS_ALLOWED_PORTS:-80,443,8080,8443}
      SAFE_EGRESS_DENY_CIDRS: ${SAFE_EGRESS_DENY_CIDRS:-}
      SAFE_EGRESS_DNS_TIMEOUT_SECONDS: ${SAFE_EGRESS_DNS_TIMEOUT_SECONDS:-5}
    volumes:
      - web-runner-control:/run/search-gateway-web:ro
      - pdf-runner-control:/run/search-gateway-pdf:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,uid=${APP_UID:-10001},gid=${APP_GID:-10001}
    networks:
      - backend
      - search-control
      - egress
      - client
    depends_on:
      redis:
        condition: service_healthy
      searxng:
        condition: service_healthy
      reranker:
        condition: service_healthy
      web-runner:
        condition: service_healthy
      pdf-runner:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    cpus: ${GATEWAY_CPUS:-1.5}
    mem_limit: ${GATEWAY_MEMORY_LIMIT:-1g}
    pids_limit: 256

  redis:
    <<: *hardened
    image: ${REDIS_IMAGE:-redis:7.4.9-alpine3.21}
    user: redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    networks: [backend]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 10
    cpus: ${REDIS_CPUS:-0.5}
    mem_limit: ${REDIS_MEMORY_LIMIT:-384m}

  searxng:
    <<: *hardened
    image: ${SEARXNG_IMAGE:-searxng/searxng:2026.7.11-62a1ab7ed}
    user: "977:977"
    environment:
      GRANIAN_WORKERS: ${SEARXNG_WORKERS:-2}
      GRANIAN_BLOCKING_THREADS: ${SEARXNG_THREADS:-4}
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET in .env}
    configs:
      - source: searxng-settings
        target: /etc/searxng/settings.yml
    volumes:
      - searxng-cache:/var/cache/searxng
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    networks: [search-control, egress]
    healthcheck:
      test: [CMD-SHELL, "wget -q --spider http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    cpus: ${SEARXNG_CPUS:-1.0}
    mem_limit: ${SEARXNG_MEMORY_LIMIT:-768m}

  reranker:
    <<: *hardened
    image: ${RERANKER_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3}
    command:
      - --model-id
      - ${RERANKER_MODEL:-BAAI/bge-reranker-base}
      - --port
      - "8000"
    environment:
      HF_HOME: /data
    volumes:
      - reranker-cache:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    networks: [backend, egress]
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:8000/health >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 20
      start_period: 5m
    cpus: ${RERANKER_CPUS:-2.0}
    mem_limit: ${RERANKER_MEMORY_LIMIT:-3g}

  safe-egress:
    <<: *hardened
    build:
      context: .
      dockerfile: Dockerfile.gateway
      target: runtime
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.11.15-slim-bookworm}
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-10001}
    image: ${SEARCH_GATEWAY_IMAGE:-private-search-gateway:local}
    command: [python, safe_egress.py]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SAFE_EGRESS_ALLOWED_PORTS: ${SAFE_EGRESS_ALLOWED_PORTS:-80,443,8080,8443}
      SAFE_EGRESS_DENY_CIDRS: ${SAFE_EGRESS_DENY_CIDRS:-}
      SAFE_EGRESS_DNS_TIMEOUT_SECONDS: ${SAFE_EGRESS_DNS_TIMEOUT_SECONDS:-5}
      SAFE_EGRESS_CONNECT_TIMEOUT_SECONDS: ${SAFE_EGRESS_CONNECT_TIMEOUT_SECONDS:-15}
      SAFE_EGRESS_HANDSHAKE_TIMEOUT_SECONDS: ${SAFE_EGRESS_HANDSHAKE_TIMEOUT_SECONDS:-5}
      SAFE_EGRESS_IDLE_TIMEOUT_SECONDS: ${SAFE_EGRESS_IDLE_TIMEOUT_SECONDS:-45}
      SAFE_EGRESS_MAX_CONNECTION_SECONDS: ${SAFE_EGRESS_MAX_CONNECTION_SECONDS:-120}
      SAFE_EGRESS_MAX_CONNECTIONS: ${SAFE_EGRESS_MAX_CONNECTIONS:-128}
      SAFE_EGRESS_QUEUE_TIMEOUT_SECONDS: ${SAFE_EGRESS_QUEUE_TIMEOUT_SECONDS:-1}
      SAFE_EGRESS_MAX_BYTES_PER_DIRECTION: ${SAFE_EGRESS_MAX_BYTES_PER_DIRECTION:-67108864}
      SAFE_EGRESS_PORT: "1080"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=${APP_UID:-10001},gid=${APP_GID:-10001}
    networks: [web-sandbox, egress]
    healthcheck:
      test: [CMD, python, safe_egress.py, --healthcheck]
      interval: 10s
      timeout: 5s
      retries: 10
    cpus: ${SAFE_EGRESS_CPUS:-0.5}
    mem_limit: ${SAFE_EGRESS_MEMORY_LIMIT:-256m}

  crawl4ai:
    <<: *hardened
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp_profile.json
    build:
      context: .
      dockerfile: Dockerfile.gateway
      target: crawl4ai-runtime
      args:
        CRAWL4AI_IMAGE: ${CRAWL4AI_IMAGE:-unclecode/crawl4ai:0.9.1}
    image: ${CRAWL4AI_DERIVED_IMAGE:-private-search-crawl4ai:local}
    user: appuser
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:?Set CRAWL4AI_API_TOKEN in .env}
      CRAWL4AI_EGRESS_CONNECT_TIMEOUT_SECONDS: ${CRAWL4AI_EGRESS_CONNECT_TIMEOUT_SECONDS:-15}
      CRAWL4AI_EGRESS_SOCKS_HOST: safe-egress
      CRAWL4AI_EGRESS_SOCKS_PORT: "1080"
      GUNICORN_BIND: 0.0.0.0:11235
      SAFE_EGRESS_ALLOWED_PORTS: ${SAFE_EGRESS_ALLOWED_PORTS:-80,443,8080,8443}
      SAFE_EGRESS_DENY_CIDRS: ${SAFE_EGRESS_DENY_CIDRS:-}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m,uid=999,gid=999
      - /var/lib/redis:rw,noexec,nosuid,size=128m,uid=999,gid=999,mode=0700
      - /var/lib/crawl4ai/outputs:rw,noexec,nosuid,size=512m,uid=999,gid=999,mode=0700
      - /home/appuser/.crawl4ai:rw,noexec,nosuid,size=256m,uid=999,gid=999,mode=0700
      - /home/appuser/.cache/url_seeder:rw,noexec,nosuid,size=128m,uid=999,gid=999,mode=0700
      - /home/appuser/.gunicorn:rw,noexec,nosuid,size=64m,uid=999,gid=999,mode=0700
    networks: [web-sandbox]
    depends_on:
      safe-egress:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:11235/health]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 3m
    cpus: ${CRAWL4AI_CPUS:-2.0}
    mem_limit: ${CRAWL4AI_MEMORY_LIMIT:-2560m}
    pids_limit: 512
    shm_size: ${CRAWL4AI_SHM_SIZE:-1gb}

  web-runner:
    <<: *hardened
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp_profile.json
    image: ${SEARCH_GATEWAY_IMAGE:-private-search-gateway:local}
    command: [python, web_runner.py]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:?Set CRAWL4AI_API_TOKEN in .env}
      CRAWL4AI_URL: http://crawl4ai:11235
      CRAWL4AI_TOTAL_TIMEOUT_SECONDS: ${CRAWL4AI_TOTAL_TIMEOUT_SECONDS:-30}
      CRAWL4AI_MAX_RESPONSE_BYTES: ${CRAWL4AI_MAX_RESPONSE_BYTES:-8388608}
      RESEARCH_BROWSER_PROXY: socks5://safe-egress:1080
      RESEARCH_BROWSER_SANDBOX_MODE: ${RESEARCH_BROWSER_SANDBOX_MODE:-auto}
      RESEARCH_BROWSER_TOTAL_TIMEOUT_SECONDS: ${RESEARCH_BROWSER_TOTAL_TIMEOUT_SECONDS:-30}
      RESEARCH_REQUIRE_WEB_ISOLATION: "true"
      RESEARCH_WEB_NETWORK_ISOLATED: "true"
      WEB_RUNNER_MAX_REQUEST_BYTES: ${WEB_RUNNER_MAX_REQUEST_BYTES:-2097152}
      WEB_RUNNER_MAX_RESPONSE_BYTES: ${WEB_RUNNER_MAX_RESPONSE_BYTES:-8388608}
      WEB_RUNNER_SOCKET: /run/search-gateway-web/runner.sock
    volumes:
      - web-runner-control:/run/search-gateway-web
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g,uid=${APP_UID:-10001},gid=${APP_GID:-10001}
      - /home/app/.cache:rw,noexec,nosuid,size=256m,uid=${APP_UID:-10001},gid=${APP_GID:-10001}
    networks: [web-sandbox]
    depends_on:
      safe-egress:
        condition: service_healthy
      crawl4ai:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, web_runner.py, --healthcheck]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 2m
    cpus: ${WEB_RUNNER_CPUS:-2.0}
    mem_limit: ${WEB_RUNNER_MEMORY_LIMIT:-2g}
    pids_limit: 512
    shm_size: ${WEB_RUNNER_SHM_SIZE:-1gb}

  pdf-runner:
    <<: *hardened
    image: ${SEARCH_GATEWAY_IMAGE:-private-search-gateway:local}
    command: [python, gateway_pdf_runner.py]
    environment:
      PDF_RUNNER_SOCKET: /run/search-gateway-pdf/runner.sock
      RESEARCH_PDF_NETWORK_ISOLATED: "true"
      GATEWAY_DIRECT_MAX_BYTES: ${GATEWAY_DIRECT_MAX_BYTES:-8388608}
      GATEWAY_PDF_MAX_PAGES: ${GATEWAY_PDF_MAX_PAGES:-100}
      GATEWAY_PAGE_MAX_CHARS: ${GATEWAY_PAGE_MAX_CHARS:-300000}
      PDF_TIMEOUT_SECONDS: ${PDF_TIMEOUT_SECONDS:-20}
      PDF_SANDBOX_MEMORY_BYTES: ${PDF_SANDBOX_MEMORY_BYTES:-536870912}
      PDF_SANDBOX_CPU_SECONDS: ${PDF_SANDBOX_CPU_SECONDS:-15}
      PDF_SANDBOX_OUTPUT_BYTES: ${PDF_SANDBOX_OUTPUT_BYTES:-6065536}
    volumes:
      - pdf-runner-control:/run/search-gateway-pdf
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,uid=${APP_UID:-10001},gid=${APP_GID:-10001}
    networks: [pdf-sandbox]
    healthcheck:
      test: [CMD, python, gateway_pdf_runner.py, --healthcheck]
      interval: 15s
      timeout: 5s
      retries: 10
    cpus: ${PDF_RUNNER_CPUS:-1.0}
    mem_limit: ${PDF_RUNNER_MEMORY_LIMIT:-512m}

configs:
  searxng-settings:
    file: ./searxng-settings.yml

networks:
  backend:
    internal: true
  search-control:
    internal: true
  web-sandbox:
    internal: true
  pdf-sandbox:
    internal: true
  egress:
  client:
    external: true
    name: ${CLIENT_DOCKER_NETWORK:-docker-stacks_app-network}

volumes:
  redis-data:
  reranker-cache:
  searxng-cache:
  web-runner-control:
  pdf-runner-control:
