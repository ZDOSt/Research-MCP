use_default_settings:
  engines:
    keep_only:
      # Broad web discovery. A small redundant set tolerates individual engine
      # failures without sending every query to dozens of providers.
      - startpage
      - bing
      - brave
      - duckduckgo
      - mojeek

      # Image discovery.
      - startpage images
      - bing images
      - brave.images
      - duckduckgo images
      - wikicommons.images

      # Current events.
      - startpage news
      - bing news
      - brave.news
      - duckduckgo news
      - reuters

      # Technical and software sources.
      - docker hub
      - github
      - mdn
      - stackoverflow
      - askubuntu

      # Academic and primary research.
      - arxiv
      - pubmed
      - semantic scholar
      - openalex
      - crossref

general:
  instance_name: "Private Search Gateway"

search:
  safe_search: 0
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  port: 8080
  # The container replaces this with SEARXNG_SECRET at runtime.
  secret_key: "ultrasecretkey"
  limiter: false
  image_proxy: false

outgoing:
  request_timeout: 5.0
  max_request_timeout: 10.0

# These engines are disabled in the pinned upstream defaults. Explicitly
# enable only selected engines; enabled defaults need no override.
engines:
  - name: bing
    disabled: false
  - name: mojeek
    disabled: false
  - name: openalex
    disabled: false
  - name: crossref
    disabled: false
    timeout: 10.0
