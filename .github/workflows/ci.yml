name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-and-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pip_audit -r requirements-gateway.txt
      - run: python -m compileall -q .
      - run: python -m ruff check . --select E9,F
      - run: python -m bandit -r . -x ./.venv,./tests -ll -ii
      - name: Run tests
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=short 2>&1 | tee pytest-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "## Pytest failure"
              echo '```text'
              tail -n 200 pytest-output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            message="$(tail -n 200 pytest-output.log | python -c 'import sys; print(sys.stdin.read().replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))')"
            echo "::error title=Pytest failure::$message"
          fi
          exit "$status"
      - name: Validate Compose configuration
        env:
          SEARXNG_SECRET: ci-only-searxng-secret
          CRAWL4AI_API_TOKEN: ci-only-crawl4ai-token
          FIRECRAWL_API_KEY: ci-only-firecrawl-key
        run: docker compose config --quiet
      - name: Validate real SearXNG startup with read-only config
        env:
          SEARXNG_SECRET: ci-only-searxng-secret
          CRAWL4AI_API_TOKEN: ci-only-crawl4ai-token
          FIRECRAWL_API_KEY: ci-only-firecrawl-key
        run: |
          docker compose up -d --no-deps --wait searxng
          docker compose exec -T searxng wget -qO- http://127.0.0.1:8080/ >/dev/null
          docker compose down --volumes
      - name: Validate zero-port shared-network deployment
        env:
          CLIENT_DOCKER_NETWORK: ci-client-network
          SEARXNG_SECRET: ci-only-searxng-secret
          CRAWL4AI_API_TOKEN: ci-only-crawl4ai-token
          FIRECRAWL_API_KEY: ci-only-firecrawl-key
        run: |
          docker compose config --format json |
            python -c 'import json, sys; compose = json.load(sys.stdin); assert all(not service.get("ports") for service in compose["services"].values()); assert compose["networks"]["client"]["name"] == "ci-client-network"'
